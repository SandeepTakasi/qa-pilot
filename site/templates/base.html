<!doctype html>
<html lang="en" class="{{html_class}}" data-base="{{base}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
{{head_extra}}
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F6F4EE">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121210">
<link rel="icon" href="{{base}}assets/favicon.svg" type="image/svg+xml">
{{preload_fonts}}
<link rel="preload" href="{{base}}assets/fonts/plex-sans-400.woff2" as="font" type="font/woff2" crossorigin>
<script>document.documentElement.classList.add('js');try{var t=localStorage.getItem('qp-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<style>{{inline_css}}</style>
<script src="{{base}}assets/site.js" defer></script>
</head>
<body>
{{> header}}
<main id="main"{{main_attrs}}>
{{content}}
</main>
{{> footer}}
<dialog class="search" data-search aria-label="Search the docs">
  <form method="dialog" class="search__form" role="search">
    <label class="visually-hidden" for="search-input">Search the docs</label>
    <input id="search-input" class="search__input" type="search" placeholder="Search the docs" autocomplete="off">
    <button class="search__close" value="close" aria-label="Close search">Esc</button>
  </form>
  <ol class="search__results"></ol>
  <p class="visually-hidden" role="status" data-search-status></p>
</dialog>
</body>
</html>

# QA-Pilot regression run. Copy to .github/workflows/ in your repo and edit the marked
# lines. Full explanation, including the two prerequisites, in SETUP-CI.md.
#
# This runs the specs QA approved against a DEPLOYED environment. It is a post-deploy and
# nightly check, not a pull request check: a PR run would test whatever happens to be
# deployed to the shared environment, not the PR's code, and produce a red or green that
# means nothing. Trigger it from your deploy job, or on a schedule.

name: QA-Pilot regression

on:
  schedule:
    - cron: '0 3 * * 1-5'    # weekday mornings, before people start
  workflow_dispatch:          # and on demand
  # Preferred, if your deploy workflow can signal completion:
  # workflow_run:
  #   workflows: ["Deploy to QA"]
  #   types: [completed]

concurrency:
  # One run at a time per environment. Two suites against one QA environment fight over
  # the same records and produce failures that are neither a regression nor reproducible.
  # With the P0 and nightly split, both runs must share one group per environment, for
  # example qa-pilot-<env>: a renamed copy of this file gets its own group below and would
  # run in parallel with the other. Set the same group on both.
  group: qa-pilot-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FEATURE: checkout                       # EDIT: the feature to regress
      QA_ENV: qa                              # EDIT: an environment key from your profile
      APP: storefront                         # EDIT: an app key from your profile
      PROFILE: qa-pilot.config.yaml           # EDIT if your profile lives elsewhere
      # Recommended split: a deploy-triggered job with PRIORITY: P0 (the cases that must
      # never break, fast), and the nightly scheduled job with it empty (everything).
      # One template serves both: copy the workflow, or use two jobs. Either way they share
      # one concurrency group per environment, and two jobs are gated by trigger with
      # `if: github.event_name == ...`, or both fire on every trigger.
      PRIORITY: ''                            # EDIT: P0 on a deploy-triggered job; empty runs everything approved
      # The most approved specs that may be skipped (edited since approval, missing, no path
      # recorded) before the job fails. '0' means any skip fails it, because a green job that
      # ran only part of the suite is the failure this exists to prevent. EDIT: raise it to
      # tolerate drift while QA catches up; empty turns the limit off. Needs plugin 0.4.1.
      MAX_SKIPPED: '0'
      PLUGIN: .qa-pilot-plugin/qa-pilot/scripts

    steps:
      - uses: actions/checkout@v4

      # Artifacts are downloadable by anyone on a public repository, and a trace can carry
      # a refresh token, so the upload below runs only on a private one. Fail closed: if the
      # lookup fails for any reason, the repository counts as public and nothing is uploaded.
      - name: Check the repository's visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRIVATE=$(gh api "repos/$GITHUB_REPOSITORY" --jq .private 2>/dev/null) || PRIVATE=false
          [ "$PRIVATE" = true ] || PRIVATE=false
          echo "PRIVATE_REPO=$PRIVATE" >> "$GITHUB_ENV"

      # The plugin is installed in Claude Code, not in your repo, so CI checks it out
      # separately. Pin a tag or SHA: an unpinned ref means a change to QA-Pilot can turn
      # your build red overnight with nothing in your own history to explain it.
      - name: Check out QA-Pilot
        uses: actions/checkout@v4
        with:
          repository: <owner>/<qa-pilot-repo>   # EDIT
          ref: v0.4.1                            # EDIT: pin a tag or SHA; MAX_SKIPPED needs 0.4.1 or newer, PRIORITY 0.4.0
          path: .qa-pilot-plugin
          # token: ${{ secrets.QA_PILOT_REPO_TOKEN }}   # only if that repo is private

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      # PREREQUISITE 1. CI has no interactive terminal, so the /setup-profiles handoff
      # cannot run here. Provide a non-interactive login that writes the same storage
      # state file the specs expect. See SETUP-CI.md; this is host-specific, so it is a
      # placeholder rather than something QA-Pilot can write for you.
      - name: Sign in
        env:
          QA_USER: ${{ secrets.QA_USER }}
          QA_PASSWORD: ${{ secrets.QA_PASSWORD }}
        run: node scripts/ci-login.mjs        # EDIT: your own login script

      # Everything about the environment comes from the profile, never from a workflow
      # variable: two places to record one fact is one place to get it wrong, and the
      # publish gate refuses a report that disagrees with the profile.
      # Assign first, THEN echo. `echo "X=$(cmd)"` returns echo's exit status, so a
      # failing command would leave X empty and let the job carry on green.
      - name: Read the environment from the profile
        run: |
          node $PLUGIN/lib/profile.mjs $PROFILE > .qa-pilot-profile.json
          KIND=$(jq -er ".environments.$QA_ENV.kind" .qa-pilot-profile.json)
          # Never production. This job uploads traces as build artifacts, and a production
          # trace carries a live session and every request body it touched. Production runs
          # are executed by a person, with evidence kept on their machine.
          if [ "$KIND" = "production" ]; then
            echo "refusing: environment $QA_ENV has kind: production, which this CI job never runs against" >&2
            exit 1
          fi
          QA_URL=$(jq -er ".environments.$QA_ENV.apps.$APP" .qa-pilot-profile.json)
          CAPTURE=$(jq -er '.evidence.capture // "always"' .qa-pilot-profile.json)
          echo "KIND=$KIND" >> $GITHUB_ENV
          echo "QA_URL=$QA_URL" >> $GITHUB_ENV
          echo "CAPTURE=$CAPTURE" >> $GITHUB_ENV
          # The write guard's view of what a write is on this host, uncompiled.
          echo "QA_PILOT_MUTATION_CONFIG=$(jq -c '.mutation // empty' .qa-pilot-profile.json)" >> $GITHUB_ENV

      # The feature's declared mutation policy, from the cases file QA approved. The write
      # guard fixture reads it; unset would run read-only, never unrestricted.
      - name: Read the mutation policy
        run: |
          node $PLUGIN/validate-cases.mjs testing/$FEATURE/cases.yaml --profile $PROFILE
          MUTATION=$(node --input-type=module -e '
            const { parse } = await import(`${process.cwd()}/${process.env.PLUGIN}/lib/yaml.mjs`);
            const { readFileSync } = await import("node:fs");
            const m = parse(readFileSync(`testing/${process.env.FEATURE}/cases.yaml`, "utf8")).mutation ?? { policy: "unrestricted" };
            console.log(JSON.stringify(m.prefix ? { policy: m.policy, prefix: m.prefix } : { policy: m.policy }));')
          echo "QA_PILOT_MUTATION=$MUTATION" >> $GITHUB_ENV

      # Each run gets its own directory, so two runs never overwrite each other's evidence.
      - name: Prepare the run directory
        run: |
          RUN_ID="${{ github.run_id }}-$FEATURE"
          RUN_DIR="testing/$FEATURE/runs/$RUN_ID"
          mkdir -p "$RUN_DIR/fixtures"
          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV
          echo "RUN_DIR=$RUN_DIR" >> $GITHUB_ENV
          echo "QA_PILOT_FIXTURE_DIR=$PWD/$RUN_DIR/fixtures" >> $GITHUB_ENV
          # Selects this feature's shared-fixture projects in the host's Playwright config
          # (see run-tests): dependency projects ignore the spec list below.
          echo "QA_PILOT_FEATURE=$FEATURE" >> $GITHUB_ENV
          echo "STARTED_AT=$(date -u +%FT%TZ)" >> $GITHUB_ENV

      # PREREQUISITE 2. The runner must be able to reach the deployed environment. If it
      # is behind a VPN or an IP allowlist, add the runner to it, or run this on a
      # self-hosted runner inside the network.
      - name: Read the deployed build, before
        run: |
          SHA_BEFORE=$(node $PLUGIN/read-env-sha.mjs $PROFILE $QA_ENV $APP --sha-only)
          echo "SHA_BEFORE=$SHA_BEFORE" >> $GITHUB_ENV

      # Runs exactly what QA approved, and only while the spec still matches what they
      # approved. No ClickUp call: approved.json is committed.
      # When PRIORITY is set, only approved cases at that priority run. Priority lives in
      # cases.yaml, not in approved.json, so the filter needs that file. Quoted, so a
      # value such as `P0, P1` stays one argument. An older plugin ignores --priority.
      # MAX_SKIPPED works the same way: passed only when non-empty, and an older plugin
      # ignores --max-skipped, so the pin above must be 0.4.1 or newer.
      # select's stderr (the skipped specs and any REFUSED line) goes to a file so the step
      # summary gets it even when select fails. GitHub runs this under `bash -eo pipefail`,
      # so a bare failing `SPECS=$(...)` would end the step before any later line ran:
      # `|| rc=$?` keeps the step alive until the summary is written, then it exits with
      # select's own status.
      - name: Select the approved specs
        run: |
          PRIORITY_ARGS=()
          if [ -n "$PRIORITY" ]; then
            PRIORITY_ARGS=(--cases testing/$FEATURE/cases.yaml --priority "$PRIORITY")
          fi
          SKIP_ARGS=()
          if [ -n "$MAX_SKIPPED" ]; then
            SKIP_ARGS=(--max-skipped "$MAX_SKIPPED")
          fi
          SPECS=$(node $PLUGIN/ci-gate.mjs select \
            --approved testing/$FEATURE/approved.json \
            --specs testing/$FEATURE/specs.json \
            "${PRIORITY_ARGS[@]}" "${SKIP_ARGS[@]}" 2>sel.err) || rc=$?
          tee -a "$GITHUB_STEP_SUMMARY" < sel.err >&2
          [ "${rc:-0}" = 0 ] || exit "$rc"
          # Belt and braces. An empty SPECS would make the next step
          # `npx playwright test` with no arguments, which runs every spec in the repo,
          # including ones QA never approved, and calls the result a regression pass.
          if [ -z "$SPECS" ]; then
            echo "select returned no specs; refusing to run the whole suite" >&2
            exit 1
          fi
          echo "SPECS=$SPECS" >> $GITHUB_ENV

      # Lint the selected specs before they run: a test with no assertion, a fixed sleep or a
      # skipped test would pass, and a pass proves nothing. The config is committed at your
      # repo root, copied from templates/eslint.qa-pilot.config.mjs (see SETUP-CI.md), and
      # needs eslint, eslint-plugin-playwright, typescript-eslint and typescript in your
      # devDependencies so `npm ci` installs them.
      # Here the specs are passed as file paths. ESLint 9 does not fail on an explicit path
      # that the config's `files` globs do not cover: it prints "File ignored because no
      # matching configuration was supplied" and exits 0, which would lint nothing and go
      # green. So the output is captured and that message fails the step; otherwise the step
      # keeps ESLint's own exit code. `|| rc=$?` survives GitHub's `bash -eo pipefail`.
      - name: Lint the selected specs
        run: |
          rc=0
          out=$(npx eslint -c eslint.qa-pilot.config.mjs $SPECS 2>&1) || rc=$?
          printf '%s\n' "$out"
          case "$out" in
            *'File ignored'*)
              echo "refusing: ESLint ignored a selected spec, so it was not linted. Add the app's spec_dir to the files list in eslint.qa-pilot.config.mjs." >&2
              exit 1 ;;
          esac
          exit "$rc"

      # $SPECS is intentionally unquoted: it is a space-separated list of spec paths.
      # `select` refuses any path containing whitespace for that reason, so the split here
      # is safe. `select --json` gives a structured list if you need one.
      # The trace mode follows the profile's evidence.capture, so the run keeps what the
      # report will claim it kept. All output lands in this run's own directory.
      - name: Run
        run: |
          case "$CAPTURE" in
            always) TRACE=on ;;
            on-failure) TRACE=retain-on-failure ;;
            *) TRACE=off ;;
          esac
          # Absolute: Playwright resolves the JSON output name against the config's directory.
          PLAYWRIGHT_JSON_OUTPUT_NAME="$PWD/$RUN_DIR/results.json" \
            npx playwright test $SPECS --reporter=json --trace "$TRACE" --output "$PWD/$RUN_DIR/test-results"
        continue-on-error: true    # the verdict step decides, so the report is built first

      - name: Read the deployed build, after
        run: |
          SHA_AFTER=$(node $PLUGIN/read-env-sha.mjs $PROFILE $QA_ENV $APP --sha-only)
          echo "SHA_AFTER=$SHA_AFTER" >> $GITHUB_ENV

      # meta.json is written by node, not a heredoc, so a null prefix stays null.
      - name: Build the report
        run: |
          node --input-type=module -e '
            const e = process.env;
            const m = JSON.parse(e.QA_PILOT_MUTATION);
            const meta = {
              run_id: e.RUN_ID, feature: e.FEATURE, app: e.APP, env_name: e.QA_ENV,
              env_kind: e.KIND, env_url: e.QA_URL, api_mode: "server",
              sha_before: e.SHA_BEFORE, sha_after: e.SHA_AFTER,
              sha_source: `${e.PROFILE}:${e.QA_ENV}`, sha_format: "commit",
              evidence_capture: e.CAPTURE,
              mutation_policy: m.policy, mutation_prefix: m.prefix ?? null,
              executor: "github-actions", model_version: "none (CI regression run)",
              started_at: e.STARTED_AT, finished_at: new Date().toISOString(),
            };
            (await import("node:fs")).writeFileSync(`${e.RUN_DIR}/meta.json`, JSON.stringify(meta, null, 2));'
          # report.json lands in the run directory, beside results.json and meta.json.
          node $PLUGIN/parse-report.mjs $RUN_DIR/results.json $RUN_DIR/meta.json \
            --specs testing/$FEATURE/specs.json

      # Keep the evidence on every run, whatever the outcome and whatever the profile's
      # evidence_upload says, but only on a private repository: this job never runs
      # production, and there a GitHub artifact is visible only to people with read access
      # to the repo, for 14 days. On a public repository anyone can download it.
      - uses: actions/upload-artifact@v4
        if: always() && env.PRIVATE_REPO == 'true'
        with:
          name: qa-pilot-${{ github.run_id }}
          path: ${{ env.RUN_DIR }}
          retention-days: 14

      - name: Say why no artifact was uploaded
        if: always() && env.PRIVATE_REPO != 'true'
        run: 'echo "QA-Pilot artifacts were skipped: this repository is public, or its visibility could not be read, and a trace can carry a refresh token." >> "$GITHUB_STEP_SUMMARY"'

      - name: Verdict
        run: node $PLUGIN/ci-gate.mjs verdict --report $RUN_DIR/report.json

# This job does not publish to ClickUp, by design. Publishing writes to the tracker as a
# person and runs through the approval gate over MCP, neither of which a build runner has.
# When a regression needs to be in ClickUp, download report.json from the artifacts and
# run /qa-pilot:publish-results against it. The artifact (private repositories only) holds
# the traces, which carry the test account's session: anyone with read access to the repo
# can download it, so keep the test account restricted and the retention short (see
# SETUP-CI.md, "Evidence in CI").
